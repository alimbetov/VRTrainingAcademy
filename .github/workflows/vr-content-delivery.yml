name: VR content delivery reference tests
on:
  push:
    branches:
      - feat/r1-signed-content-delivery-foundation
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/vr-content-delivery.yml'
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run JUnit
        run: mvn -B --no-transfer-progress clean verify
