name: Content Studio React CI
on:
  push:
    branches: [main, 'feat/**', 'integration/**']
    paths: ['content-studio/**','.github/workflows/content-studio-ui.yml']
  pull_request:
    paths: ['content-studio/**','.github/workflows/content-studio-ui.yml']
permissions:
  contents: read
jobs:
  ui-build-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: content-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Unit and API contract tests
        run: npm test
      - name: TypeScript production build
        run: npm run build
